name: Nobitex public history collector

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nobitex-history-collector.yml"
      - "scripts/collect_nobitex_history.py"
      - "src/lili_trader/nobitex_data.py"
      - "src/lili_trader/history_store.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: nobitex-public-api
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public Nobitex history
        run: python scripts/collect_nobitex_history.py
      - name: Preserve collected snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/collected-history"
          cp -a data/history/. "$RUNNER_TEMP/collected-history/"
      - name: Merge snapshot safely and push
        id: commit_history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed=false
          changed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python - "$RUNNER_TEMP/collected-history" <<'PY'
          import csv
          import os
          import sys
          from pathlib import Path

          snapshot = Path(sys.argv[1])
          history = Path("data/history")
          history.mkdir(parents=True, exist_ok=True)
          fields = ["timestamp", "open", "high", "low", "close", "volume"]
          max_rows = 25_000

          for incoming_path in sorted(list(snapshot.glob("BTCIRT_*.csv")) + list(snapshot.glob("ETHIRT_*.csv"))):
              current_path = history / incoming_path.name
              rows_by_timestamp = {}
              for path in (current_path, incoming_path):
                  if not path.exists():
                      continue
                  with path.open(encoding="utf-8", newline="") as handle:
                      reader = csv.DictReader(handle)
                      if reader.fieldnames != fields:
                          raise SystemExit(f"Invalid CSV columns: {path}")
                      for row in reader:
                          timestamp = int(row["timestamp"])
                          # The collected snapshot takes precedence for duplicate
                          # timestamps (e.g. the latest candle correction).
                          rows_by_timestamp[timestamp] = row
              rows = [rows_by_timestamp[t] for t in sorted(rows_by_timestamp)[-max_rows:]]
              tmp = current_path.with_suffix(".csv.tmp")
              with tmp.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows)
              os.replace(tmp, current_path)

          # Preserve the provenance sidecars for any 5m bars reconstructed
          # from five exact Nobitex 1m candles. Deduplicate by symbol/resolution/
          # timestamp/method so reruns remain idempotent.
          import json
          for incoming_path in sorted(snapshot.glob("*_5_recovery_manifest.jsonl")):
              current_path = history / incoming_path.name
              records = {}
              for path in (current_path, incoming_path):
                  if not path.exists():
                      continue
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if not line.strip():
                          continue
                      record = json.loads(line)
                      key = (
                          record["symbol"], record["resolution"],
                          int(record["timestamp"]), record["method"],
                      )
                      records[key] = record
              ordered = sorted(records.values(), key=lambda row: (
                  row["symbol"], row["resolution"], int(row["timestamp"]), row["method"]
              ))
              tmp = current_path.with_suffix(".jsonl.tmp")
              tmp.write_text(
                  "".join(json.dumps(row, sort_keys=True) + "\\n" for row in ordered),
                  encoding="utf-8",
              )
              os.replace(tmp, current_path)
          PY

            git add data/history
            if git diff --cached --quiet; then
              echo "No new candles to store."
              changed=false
              pushed=true
              break
            fi
            git commit -m "data: collect public Nobitex candle history"
            if git push origin HEAD:main; then
              pushed=true
              changed=true
              break
            fi
            echo "Push raced with another commit; retrying safely ($attempt/5)."
          done

          if [ "$pushed" != "true" ]; then
            echo "Could not push collected history after 5 safe merge attempts."
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Trigger backtest against accumulated history
        if: steps.commit_history.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nobitex-backtest.yml --ref main
