name: Li-Li Trader CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js for chart syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check chart JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("docs/chart.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline chart script found")
          Path("/tmp/lili-chart.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/lili-chart.js
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
