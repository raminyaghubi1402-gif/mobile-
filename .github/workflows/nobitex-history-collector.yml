name: Nobitex public history collector

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nobitex-history-collector.yml"
      - "scripts/collect_nobitex_history.py"
      - "src/lili_trader/nobitex_data.py"
      - "src/lili_trader/history_store.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: nobitex-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public Nobitex history
        run: python scripts/collect_nobitex_history.py
      - name: Commit updated public history
        id: commit_history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No new candles to store."
          else
            git commit -m "data: collect public Nobitex candle history"
            # Other source commits may land while the public-data job is running.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger backtest against accumulated history
        if: steps.commit_history.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nobitex-backtest.yml --ref main
