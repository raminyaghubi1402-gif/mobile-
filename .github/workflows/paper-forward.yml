name: Li-Li Forward Paper

on:
  workflow_dispatch:
    inputs:
      usd_irt_rate:
        description: "Fresh manual seed rate: IRT per USD (only used on first initialization)"
        required: false
        type: string
      rate_source:
        description: "Source/name/URL for the seed rate"
        required: false
        type: string
      rate_observed_at:
        description: "ISO-8601 timestamp with timezone, no older than 15 minutes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lili-forward-paper
  cancel-in-progress: false

jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run one read-only market and paper cycle
        id: paper_cycle
        env:
          FORWARD_USD_IRT_RATE: ${{ inputs.usd_irt_rate }}
          FORWARD_USD_IRT_SOURCE: ${{ inputs.rate_source }}
          FORWARD_USD_IRT_AT: ${{ inputs.rate_observed_at }}
        run: |
          args=(--paper-forward --forward-state-dir data/paper/forward)
          if [ -n "$FORWARD_USD_IRT_RATE" ]; then
            args+=(--forward-usd-irt-rate "$FORWARD_USD_IRT_RATE")
          fi
          if [ -n "$FORWARD_USD_IRT_SOURCE" ]; then
            args+=(--forward-usd-irt-source "$FORWARD_USD_IRT_SOURCE")
          fi
          if [ -n "$FORWARD_USD_IRT_AT" ]; then
            args+=(--forward-usd-irt-at "$FORWARD_USD_IRT_AT")
          fi
          PYTHONPATH=src python -m lili_trader "${args[@]}"
      - name: Write Paper cycle summary
        id: paper_summary
        if: always()
        env:
          CYCLE_OUTCOME: ${{ steps.paper_cycle.outcome }}
          CYCLE_STATUS: ${{ steps.paper_cycle.outputs.status }}
          TRIGGER_EVENT: ${{ github.event_name }}
          PAPER_STATE_DIR: data/paper/forward
        run: PYTHONPATH=src python -m lili_trader.paper_summary
