name: Nobitex public historical backtest

on:
  schedule:
    - cron: "45 18 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nobitex-backtest.yml"
      - "src/lili_trader/**"
      - "tests/test_nobitex_data.py"
      - "tests/test_history_gap_audit.py"
      - "scripts/audit_history_gaps.py"
      - "data/history/**"

permissions:
  contents: read

concurrency:
  group: nobitex-stored-history-backtest
  cancel-in-progress: true

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCIRT, ETHIRT]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit required candle continuity before backtest
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_history_gaps.py \
            --symbol ${{ matrix.symbol }} \
            --resolution 5 --resolution 15 --resolution 60 \
            --output history-gap-audit.json 2>&1 | tee -a nobitex-backtest-report.txt
      - name: Run read-only Nobitex historical backtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/paper/backtest
          echo "Spot-only historical audit; per-symbol starting capital is 13,550,000 IRT (5 USD at the user-confirmed seed rate 2,710,000 IRT/USD). This is a historical simulation, not a live balance." | tee -a nobitex-backtest-report.txt
          PYTHONPATH=src python -m lili_trader --price-action-backtest --stored-history-only --spot-only --sr-diagnostic --symbol ${{ matrix.symbol }} --count 5000 --backtest-cash 13550000 --backtest-currency IRT --decision-journal "data/paper/backtest/${{ matrix.symbol }}.jsonl" 2>&1 | tee -a nobitex-backtest-report.txt
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lili-${{ matrix.symbol }}-price-action-backtest
          path: |
            nobitex-backtest-report.txt
            data/paper/backtest/${{ matrix.symbol }}.jsonl
            history-gap-audit.json
          if-no-files-found: ignore
          retention-days: 7
