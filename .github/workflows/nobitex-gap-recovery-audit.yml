name: Nobitex live gap recovery audit

on:
  pull_request:
    paths:
      - ".github/workflows/nobitex-gap-recovery-audit.yml"
      - "scripts/audit_nobitex_gap_recovery.py"
      - "src/lili_trader/history_gap_recovery.py"
      - "src/lili_trader/nobitex_data.py"
      - "src/lili_trader/history_store.py"
      - "data/history/*_5.csv"

permissions:
  contents: read

concurrency:
  group: nobitex-live-gap-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe exact Nobitex candle recovery (read-only)
        run: python scripts/audit_nobitex_gap_recovery.py
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nobitex-live-gap-recovery-audit
          path: reports/nobitex-gap-recovery-audit.txt
          if-no-files-found: ignore
          retention-days: 7
