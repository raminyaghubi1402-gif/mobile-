name: Li-Li Trader CI

on:
  push:
    branches: [main, 'work/**']
    paths-ignore:
      - 'data/paper/forward/**'
  pull_request:
    paths-ignore:
      - 'data/paper/forward/**'
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js for chart syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check chart JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("docs/chart.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline chart script found")
          Path("/tmp/lili-chart.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/lili-chart.js
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Audit checked-in historical market structure
        run: PYTHONPATH=src python scripts/market_structure_historical_audit.py
      - name: Upload historical audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-structure-historical-audit
          path: market-structure-historical-audit.txt
          if-no-files-found: ignore
          retention-days: 14
